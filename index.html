<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FranquiciaChat — ComicSansCon</title>
  <meta name="description" content="Chatea con tus personajes favoritos usando IA." />
  <link rel="stylesheet" href="/src/css/styles.css" />
  <link rel="stylesheet" href="/src/css/cards.css" />
  <script type="importmap">
    {
      "imports": {
        "axios": "https://cdn.jsdelivr.net/npm/axios@1.7.9/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <a href="/home" class="brand" data-link>
        <span class="brand-emoji">🎭</span>
        <span>FranquiciaChat</span>
      </a>

      <nav class="main-nav">
        <a href="/home" data-link data-route="home">Inicio</a>
        <a href="/characters" data-link data-route="characters">Personajes</a>
        <a href="/about" data-link data-route="about">Acerca de</a>
      </nav>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        🌙
      </button>
    </header>

    <!-- El router carga acá cada vista dinámicamente con fetch -->
    <main id="view-root" class="view-root" aria-live="polite"></main>

  </div>

  <script type="module" src="/src/js/app.js"></script>

</html>
